<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Run: Cyber Assault</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-wrapper">
        <div id="ui-layer">
            <div
                style="position: absolute; top: 20px; right: 30px; font-family: 'Courier New', Courier, monospace; font-size: 24px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-weight: bold; z-index: 10; letter-spacing: 2px;">
                <span id="ui-hi-dist">HI 00000</span> &nbsp; <span id="ui-dist">00000</span>
            </div>

            <div id="game-over-screen" class="overlay hidden">
                <h1 class="danger">GAME OVER</h1>
                <p>PRESS <kbd>SPACE</kbd> TO REBOOT</p>
            </div>

            <div id="coming-soon-screen" class="overlay hidden">
                <h2 class="text-cyan">PHASE 1 COMPLETE</h2>
                <h1 class="success">ENTERING CATTLE ZONE</h1>
                <p class="blink">COMING SOON...</p>
            </div>
            <div id="mcq-screen" class="hidden mcq-overlay">
                <div class="mcq-modal">
                    <h2 id="mcq-question">Question goes here?</h2>
                    <div id="mcq-options" class="mcq-options-container">
                    </div>
                </div>
            </div>
        </div>

        <div id="reward-screen" class="hidden mcq-overlay">
            <div class="mcq-modal" style="border-color: #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);">
                <h2 style="color: #00ffcc; font-size: 2.2rem; margin-bottom: 10px; text-shadow: 0 0 10px #00ffcc;">LEVEL
                    UP!</h2>
                <h3 id="reward-text" style="color: #ffea00; margin: 20px 0; font-size: 1.5rem;">You got: Plasma Bullets!
                </h3>
                <button id="reward-continue" class="mcq-btn"
                    style="border-color: #ffea00; color: #ffea00; margin-top: 15px;">START PHASE 2 🚀</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <button id="mobile-fire-btn" class="hidden fire-btn">FIRE</button>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
